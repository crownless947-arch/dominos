<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Dominos Моніторинг</title>
<style>
*{box-sizing:border-box}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#121214;color:#fff;margin:0;padding:12px;display:flex;flex-direction:column;align-items:center}
h1{font-size:16px;text-align:center;margin:0 0 12px;font-weight:800}.connection{font-size:12px;color:#bbc3ce;max-width:440px;margin-bottom:12px;line-height:1.4}.connection.error{color:#ffb56a}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;max-width:440px}
.card{border:2px solid #34c759;background:#f2fbf4;border-radius:16px;padding:12px;min-height:120px;color:#222;overflow-wrap:anywhere}
.card.warning{border-color:#fc0;background:#fffbeb}.card.danger-hour{border-color:#ff9500;background:#fff5e6}.card.alarm-blue{border-color:#007aff;background:#ebf5ff}.card.danger-stop{border:4px solid #ff1a1a;background:#ffebe6;box-shadow:0 0 15px #ff1a1a55}.card.unknown{border-color:#87909c;background:#e9edf2}
.card-header{display:flex;align-items:center;justify-content:space-between;gap:4px}.num{font-size:20px;font-weight:900}.timer{font-size:11px;font-weight:bold;padding:2px 7px;border-radius:20px;background:#ff9500;color:white}.danger-stop .timer{background:#f11}.address{font-size:12px;font-weight:bold;color:#666;margin:4px 0 8px}.line{font-size:13px;margin-bottom:4px}.reason{font-size:11px;color:#9b4c00;font-weight:bold;margin-top:6px;white-space:pre-line}.alarm-blue .reason{color:#0053b3}.danger-stop .reason{color:#b00}.updated{font-size:10px;color:#62666c;margin-top:8px}
</style>
</head>
<body>
<h1>🍕 DOMINO'S МОНІТОРИНГ СТОПІВ</h1>
<div id="connection" class="connection" role="status">⏳ Завантаження…</div>
<div id="grid" class="grid"></div>
<script>
const source = new URLSearchParams(location.search).get('url');
let loading = false;
function el(tag,cls,text){const x=document.createElement(tag);x.className=cls;x.textContent=text;return x;}
function note(text,bad){const x=document.getElementById('connection');x.textContent=text;x.className='connection'+(bad?' error':'');}
function render(data){
  const grid=document.getElementById('grid');const fragment=document.createDocumentFragment();
  for(const item of data){
    const kind=['normal','warning','danger-hour','danger-stop','alarm-blue','unknown'].includes(item.kind)?item.kind:'unknown';
    const card=el('div','card '+kind,'');const head=el('div','card-header','');head.append(el('span','num','#'+item.num));
    if(kind==='danger-hour'||kind==='danger-stop')head.append(el('span','timer',Math.max(0,Number(item.minutes)||0)+' хв'));
    card.append(head,el('div','address',item.address),el('div','line','🛵 Дост: '+item.delivery),el('div','line','📦 Сам: '+item.pickup));
    if(item.reason && !['Норма','Початок зміни (Авто)'].includes(item.reason))card.append(el('div','reason','⚠️ '+item.reason));
    if(item.updated){const t=new Date(item.updated);if(Number.isFinite(t.getTime()))card.append(el('div','updated','Повідомлення: '+t.toLocaleString('uk-UA',{timeZone:'Europe/Kyiv',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})));}
    fragment.append(card);
  }
  grid.replaceChildren(fragment);
}
async function loadData(){
  if(loading)return;
  if(!source){note('❌ У посиланні немає параметра url із адресою Google Apps Script.',true);return;}
  loading=true;const abort=new AbortController();const timeout=setTimeout(()=>abort.abort(),12000);
  try{
    const u=new URL(source);if(u.protocol!=='https:')throw Error('Потрібне HTTPS-посилання');
    u.searchParams.set('_',Date.now());const response=await fetch(u,{signal:abort.signal,cache:'no-store'});
    if(!response.ok)throw Error('HTTP '+response.status);
    const data=await response.json();if(!Array.isArray(data)||!data.length)throw Error(data.error||'Немає даних');
    render(data);
    const checked=Math.min(...data.map(x=>new Date(x.checked).getTime()||0));
    if(Date.now()-checked>7*60000)note('⚠️ Telegram давно не перевірявся. Нижче — останні збережені дані.',true);
    else note('● Дані отримано о '+new Date().toLocaleTimeString('uk-UA',{timeZone:'Europe/Kyiv'})+' · оновлення кожні 15 с',false);
  }catch(e){note('⚠️ Не вдалося оновити дані. Показано останні отримані значення.',true);}
  finally{clearTimeout(timeout);loading=false;}
}
loadData();setInterval(loadData,15000);
</script>
</body>
</html>
